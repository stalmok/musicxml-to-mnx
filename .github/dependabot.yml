# Cooldown of 1 day matches minimumReleaseAge in pnpm-workspace.yaml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
