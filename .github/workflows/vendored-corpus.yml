# The vendored corpus, on every push to main and every pull request that
# changes what it tests: the converter, the schema, the checks, the songs, or
# the dependencies. ci.yml skips it because it takes minutes. This workflow
# finds a reader or writer regression at the commit that caused it.
#
# Actions are pinned to commit SHAs.
name: Vendored corpus

on:
  push:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'schema/**'
      - 'tests/corpus.test.ts'
      - 'tests/corpus/**'
      - 'tests/support/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vendored-corpus.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# Runs on main always finish, because a cancelled run on main would hide a
# broken commit.
concurrency:
  group: vendored-corpus-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:corpus
