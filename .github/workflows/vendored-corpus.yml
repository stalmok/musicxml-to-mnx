# The vendored corpus, on every push to main and every pull request that
# changes what it tests: the converter, the schema, the checks, the songs, or
# the dependencies. ci.yml skips it because it takes minutes. This workflow
# finds a reader or writer regression at the commit that caused it.
#
# Actions are pinned to commit SHAs.
name: Vendored corpus

on:
  push:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'schema/**'
      - 'tests/corpus.test.ts'
      - 'tests/corpus/**'
      - 'tests/support/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vendored-corpus.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# Runs on main always finish, because a cancelled run on main would hide a
# broken commit.
concurrency:
  group: vendored-corpus-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:corpus
