# Publish to npm when a version tag (v0.1.0, …) is pushed. The CI gate set
# runs first, by CALLING ci.yml with the vendored corpus added, so releases
# and pushes are guarded by the same list and a gate added there cannot be
# forgotten here. The publish job then builds explicitly (install scripts stay
# blocked) and publishes via npm trusted publishing: the workflow's OIDC token
# IS the credential, so no npm token secret exists to leak, and provenance
# attestation is automatic.
#
# One-time setup on npmjs.com (package settings → Trusted Publisher):
#   GitHub Actions / stalmok / ossia / release.yml
# If the very first publish of the package can't be configured ahead of time,
# bootstrap once with a short-lived granular token, add the trusted publisher,
# then revoke the token.
name: Release

on:
  push:
    tags: ['v*']

# Read-only by default. The OIDC token that can mint an npm publish
# credential is granted to the publish job alone, not to the gates job, which
# runs the test suite and third-party actions.
permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    with:
      corpus: true

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # BOOTSTRAP: the first publish uses an NPM_TOKEN secret, because trusted
    # publishing cannot be configured on npmjs.com until the package exists.
    # id-token:write is deliberately absent — with it, npm 11.5+ attempts the
    # OIDC exchange and fails when no trusted publisher is set up yet, even with
    # a token present. After this release, configure the trusted publisher,
    # revoke the token, and restore id-token:write + provenance below.
    permissions:
      contents: read
    # A second pair of eyes on every release, and where the NPM_TOKEN secret
    # lives: configure required reviewers on the environment.
    environment: npm-publish
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      # Node 24 bundles npm ≥ 11.5.1, the minimum for trusted publishing.
      # .nvmrc pins 24, so the version file serves here too.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The tag must match package.json, so a mismatched release fails loudly.
      - name: Check tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package $pkg"; exit 1; }

      - run: pnpm build

      # npm (not pnpm) publish. BOOTSTRAP: authenticated by the NPM_TOKEN
      # secret. setup-node wrote an .npmrc that reads this variable. Once
      # trusted publishing is configured, drop the env and add --provenance.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
