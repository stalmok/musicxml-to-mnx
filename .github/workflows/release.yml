# Publish to npm when a version tag (v0.1.0, …) is pushed. The CI gate set
# runs first, by calling ci.yml with the vendored corpus added, so releases
# and pushes run the same gates. The pack job then builds explicitly (install
# scripts stay blocked) and packs the tarball. The publish job stages that tarball via npm
# trusted publishing: the workflow's OIDC token is the credential, so no npm
# token secret exists to leak. npm attests the build only when the GitHub
# repository is public; from a private repository it stages with no
# attestation. The publish job installs nothing and uses no cache, so no dependency code runs
# where the OIDC token can be requested. A staged version is not public until a
# maintainer approves it with 2FA, on npmjs.com (Staged Packages tab) or with
# `npm stage approve <stage-id>`.
#
# One-time setup on npmjs.com (package settings → Trusted Publisher):
#   GitHub Actions / stalmok / musicxml-to-mnx / release.yml / npm-publish,
#   with "Allow npm publish" unchecked, so CI can only stage.
name: Release

on:
  push:
    tags: ['v*']

# Read-only by default. The OIDC token that can mint an npm publish
# credential is granted to the publish job alone, not to the gates and pack
# jobs, which run the test suite, the build and third-party actions.
permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    with:
      corpus: true

  pack:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tag must match the version in package.json.
      - name: Check tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package $pkg"; exit 1; }

      - run: pnpm build

      # npm pack does not create the destination directory.
      - run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    steps:
      # Only .nvmrc, for the Node version. Nothing from the repository runs.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      # .nvmrc pins Node 24, whose current releases bundle npm 11.19.
      # Staged publishing needs npm 11.15.0 or later; an older npm fails
      # the publish step with an unknown command. No cache: a restored cache
      # is code this job did not build.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      # npm, not pnpm, stages the version. A tarball runs no lifecycle scripts.
      - run: npm stage publish "$RUNNER_TEMP"/package/*.tgz
