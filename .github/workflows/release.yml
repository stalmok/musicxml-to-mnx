# Publish to npm when a version tag (v0.1.0, …) is pushed. The CI gate set
# runs first, by CALLING ci.yml with the vendored corpus added, so releases
# and pushes are guarded by the same list and a gate added there cannot be
# forgotten here. The publish job then builds explicitly (install scripts stay
# blocked) and stages the version via npm trusted publishing: the workflow's
# OIDC token is the credential, so no npm token secret exists to leak, and
# provenance attestation is automatic. A staged version is not public until a
# maintainer approves it with 2FA, on npmjs.com (Staged Packages tab) or with
# `npm stage approve <stage-id>`.
#
# One-time setup on npmjs.com (package settings → Trusted Publisher):
#   GitHub Actions / stalmok / musicxml-to-mnx / release.yml / npm-publish,
#   with "Allow npm publish" unchecked, so CI can only stage.
name: Release

on:
  push:
    tags: ['v*']

# Read-only by default. The OIDC token that can mint an npm publish
# credential is granted to the publish job alone, not to the gates job, which
# runs the test suite and third-party actions.
permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    with:
      corpus: true

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      # .nvmrc pins Node 24, whose current releases bundle npm 11.19.
      # Staged publishing needs npm 11.15.0 or later; an older npm fails
      # the publish step with an unknown command.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The tag must match package.json, so a mismatched release fails loudly.
      - name: Check tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package $pkg"; exit 1; }

      - run: pnpm build

      # npm, not pnpm, stages the version.
      - run: npm stage publish
