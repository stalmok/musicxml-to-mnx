# Every gate, on every push to main and every pull request: the same checks
# the pre-commit hook runs, plus the library build and a check that the build
# ships what the package's exports promise. Also callable as a unit
# (workflow_call), so the release workflow runs the same gate set. A gate
# added here guards releases too, with no second list to forget.
#
# The vendored corpus runs only when a caller sets the corpus input, which the
# release workflow does. Pushes and pull requests skip it for speed.
#
# The dependency audit is not here: a new advisory against a dependency a
# change never touched would redden it. It runs weekly and on demand instead,
# in audit.yml.
#
# Actions are pinned to commit SHAs (not tags) to match the repo's
# supply-chain posture: a tag can be moved, a SHA cannot.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      corpus:
        description: Also run the vendored corpus.
        type: boolean
        default: false

# Default-deny: jobs get read-only access to the repo and nothing else.
permissions:
  contents: read

# Rapid pushes supersede in-flight runs of the same PR branch. Runs on main
# always finish, because a cancelled run on main would hide a broken commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.corpus && 40 || 15 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The job only reads the tree; no step pushes.
          persist-credentials: false

      # Reads the pinned pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # One Node version everywhere: .nvmrc is the single source.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      # The import graph: stage boundaries, cycles, dead files, and a
      # dev-only dependency reaching the shipped library.
      - run: pnpm deps:check
      - run: pnpm format:check
      # The suite with its coverage thresholds. The vendored corpus is added
      # only when the corpus input is set.
      - run: pnpm test:precommit
        if: ${{ !inputs.corpus }}
      - run: pnpm test:coverage
        if: ${{ inputs.corpus }}

      - run: pnpm build

      # The build must ship what the package's exports promise: the library
      # bundle, its type entry, and the command with its shebang.
      - name: Check the build's shipped files
        # Explicit bash: adds pipefail to the default -e, so a future edit that
        # pipes a check cannot swallow its failure.
        shell: bash
        run: |
          test -s dist/ossia.js
          test -s dist/types/index.d.ts
          test -s dist/cli.js
          head -1 dist/cli.js | grep -q '^#!/usr/bin/env node'

      # The smoke tests of the built command and the built library skip until
      # the package is built, so they run here, once dist/ exists, to prove the
      # shipped artifacts run: the command under Node, and the library with no
      # host globals at all.
      - name: Exercise the built artifacts
        run: pnpm exec vitest run tests/cli-artifact.test.ts tests/isomorphic-artifact.test.ts

      # The vendored MNX schema is the conformance oracle for every test in
      # the suite, so its bytes must be the ones PROVENANCE.md attests to. A
      # silently-edited schema would weaken every gate at once.
      - name: Verify vendored schema integrity
        shell: bash
        run: |
          cd schema
          sha256sum --check SHA256SUMS

  # package.json's engines field claims Node 20 and 22 as well as the Node
  # the checks run on, so the suite and the built command run on the lowest
  # version of each. pnpm needs a newer Node than either, so the install and
  # the build run on .nvmrc's, and the suite on the one under test.
  # tests/node-versions.test.ts holds this matrix to the engines field.
  node-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.13.0']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          # Otherwise the packageManager field turns on the pnpm cache, which
          # runs pnpm on this Node.
          package-manager-cache: false

      # Called directly, because pnpm does not run on this Node. With the
      # build in place, the command's smoke test runs too.
      - run: ./node_modules/.bin/vitest run --exclude '**/corpus.test.ts'

  # Blocks a pull request that introduces a dependency with a known
  # vulnerability or a disallowed licence, before it can reach the lockfile.
  # Pull requests only: it diffs the PR against its base.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: low
