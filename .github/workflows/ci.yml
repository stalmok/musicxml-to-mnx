# Every gate, on every push to main and every pull request: the same checks
# the pre-commit hook runs, plus the library build and a check that the build
# ships what the package's exports promise. Also callable as a unit
# (workflow_call), so the release workflow runs the same gate set. A gate
# added here also runs before a release.
#
# The vendored corpus runs here only when a caller sets the corpus input, which
# the release workflow does. Pushes and pull requests that change what it tests
# run it in vendored-corpus.yml instead, so it does not slow every push.
#
# The dependency audit is not here: a new advisory against a dependency a
# change did not touch would fail it. It runs weekly and on demand instead,
# in audit.yml.
#
# Actions are pinned to commit SHAs, not tags: a tag can be moved, a SHA cannot.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      corpus:
        description: Also run the vendored corpus.
        type: boolean
        default: false

# Default-deny: jobs get read-only access to the repo and nothing else.
permissions:
  contents: read

# Rapid pushes supersede in-flight runs of the same PR branch. Runs on main
# always finish, because a cancelled run on main would hide a broken commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.corpus && 40 || 15 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The job only reads the tree; no step pushes.
          persist-credentials: false

      # Reads the pinned pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # One Node version everywhere: .nvmrc is the single source.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      # The import graph: stage boundaries, cycles, dead files, and a
      # dev-only dependency reaching the shipped library.
      - run: pnpm deps:check
      - run: pnpm format:check
      # The suite with its coverage thresholds. The vendored corpus is added
      # only when the corpus input is set.
      - run: pnpm test:precommit
        if: ${{ !inputs.corpus }}
      - run: pnpm test:coverage
        if: ${{ inputs.corpus }}

      - run: pnpm build

      # The build must ship what the package's exports promise: the library
      # bundle, its type entry, the command with its shebang and the licences of
      # the code it inlines, and the schema.
      - name: Check the build's shipped files
        # Explicit bash: adds pipefail to the default -e, so a future edit that
        # pipes a check cannot swallow its failure.
        shell: bash
        run: |
          test -s dist/musicxml-to-mnx.js
          test -s dist/types/index.d.ts
          test -s dist/cli.js
          head -1 dist/cli.js | grep -q '^#!/usr/bin/env node'
          node --input-type=module -e "await import('musicxml-to-mnx/schema/mnx-schema.json', { with: { type: 'json' } })"
          # The files above resolve from the checkout. The package must ship them too.
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          for file in dist/musicxml-to-mnx.js dist/types/index.d.ts dist/cli.js schema/mnx-schema.json schema/PROVENANCE.md LICENSE; do
            jq -e --arg file "$file" '.[0].files | any(.path == $file)' "$RUNNER_TEMP/pack.json" > /dev/null || { echo "the package does not ship $file"; exit 1; }
          done
          # npm publish rewrites what it finds invalid in package.json, and
          # removes a bin entry whose path it does not accept.
          npm pkg fix
          git diff --exit-code package.json

      # The smoke tests of the built command, library and declarations skip
      # until the package is built, so they run here, once dist/ exists. They
      # test the command under Node, the library with no host globals, and the
      # declarations compiled by a consumer.
      - name: Exercise the built artifacts
        run: pnpm exec vitest run tests/cli-artifact.test.ts tests/isomorphic-artifact.test.ts tests/declarations-artifact.test.ts

      # The vendored MNX schema must match the checksum in PROVENANCE.md.
      - name: Verify vendored schema integrity
        shell: bash
        run: |
          cd schema
          sha256sum --check SHA256SUMS

      # package.json's engines field claims Node 22 as well as the Node the
      # checks run on, so the suite and the built command run on the lowest
      # Node 22 version. pnpm needs a newer Node, so the install and the build
      # above ran on .nvmrc's. These steps come last, in this job rather than a
      # job of their own, so the install and the build are not repeated.
      # tests/node-versions.test.ts holds this version to the engines field.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.0'
          # Otherwise the packageManager field turns on the pnpm cache, which
          # runs pnpm on this Node.
          package-manager-cache: false
      # Called directly, because pnpm does not run on this Node. With the
      # build in place, the command's smoke test runs too.
      - run: ./node_modules/.bin/vitest run --exclude '**/corpus.test.ts'

  # Blocks a pull request that introduces a dependency with a known
  # vulnerability or a disallowed licence, before it can reach the lockfile.
  # Pull requests only: it diffs the PR against its base.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: low
