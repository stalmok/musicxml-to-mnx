# The dependency audit, weekly and on demand. It does not run per push,
# because a new advisory against a dependency a change did not touch would
# fail that change. Run it on demand before you tag a release. Contributors
# run `pnpm audit` after they install or update a package (see CONTRIBUTING.md).
#
# Actions are pinned to commit SHAs.
name: Audit

on:
  schedule:
    # Mondays at 07:00 UTC, an hour after the corpus gate.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit
