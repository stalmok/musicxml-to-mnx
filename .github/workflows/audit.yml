# The dependency audit, weekly and on demand. It does not run per push,
# because a new advisory against a dependency a change did not touch would
# fail that change. Run it on demand before you tag a release. Contributors
# run `pnpm audit` after they install or update a package (see CONTRIBUTING.md).
#
# Actions are pinned to commit SHAs.
name: Audit

on:
  schedule:
    # Mondays at 07:00 UTC, an hour after the corpus gate.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit
