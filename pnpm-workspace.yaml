# pnpm reads its configuration from this file (pnpm 11+).
# === Supply-chain hardening ===

# Block dependency lifecycle/build scripts. Empty allowlist = no dependency may
# run install/postinstall scripts, so a compromised release cannot execute
# code at install time. Add a package here only after
# auditing why it needs a build step.
onlyBuiltDependencies: []

# Also block the root package's own lifecycle scripts during install.
ignoreScripts: true

# Pin exact versions on `pnpm add`, with no ^ or ~ ranges, so the lockfile is the
# only thing that moves a version.
saveExact: true

# Refuse to install under an unsupported Node (see "engines" in package.json).
engineStrict: true

# Cooldown: don't resolve a dependency version younger than this many minutes,
# so a freshly-published compromised release has time to be caught. 1440 = 24h.
minimumReleaseAge: 1440

# Force a patched transitive dependency ahead of its parent picking it up.
# An override names an exact version, so it does not follow an advisory range
# that grows. The weekly `pnpm audit` finds an override that is out of date.
#
# fast-uri <3.1.5, pulled in by ajv (dev-only, and bundled into the command's
# --validate), is GHSA-v2hh-gcrm-f6hx: host confusion via a backslash authority
# delimiter. The range first read <=3.1.3 and now reads <3.1.5. 3.1.6 is the
# newest 3.x and satisfies ajv's ^3.0.1. Remove when ajv depends on a patched
# range itself.
#
# brace-expansion <5.0.9, pulled in by minimatch under eslint (dev-only), is
# GHSA-mh99-v99m-4gvg: an out-of-memory DoS on unbounded expansion. The range
# first read <=5.0.7 and now reads <5.0.9, the earlier fix having been found
# to be incomplete. 5.0.9 patches it and satisfies minimatch's range. Remove
# when eslint's minimatch depends on a patched range itself.
#
# qs, pulled in by typed-rest-client under the mutation testing runner
# (dev-only), is named by two advisories. GHSA-x5fp-wj9c-mxmx is an array-limit
# bypass through a bracket key parsed as a comma list, reading >=6.14.2
# <=6.15.3. GHSA-4mjr-xmp4-gh2g is a denial of service through an attacker
# controlled isBuffer, reading >=2.2.5 <6.16.0. They replace the TypeError
# crash this pin first held past, which the 6.15.x line had already fixed.
# typed-rest-client 2.3.1 pins qs 6.15.1 exactly and the parent range cannot
# reach further, so 6.16.0 is forced here. Remove when the runner's
# typed-rest-client range reaches a version pinning 6.16.0 or later.
overrides:
  fast-uri: 3.1.6
  brace-expansion: 5.0.9
  qs: 6.16.0
